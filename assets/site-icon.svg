<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="glass" x1="32" y1="22" x2="224" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#83918E" stop-opacity=".82"/>
      <stop offset=".48" stop-color="#3A4947" stop-opacity=".78"/>
      <stop offset="1" stop-color="#202932" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="edge" x1="52" y1="18" x2="202" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".50"/>
      <stop offset=".42" stop-color="#DCE9E6" stop-opacity=".20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="shine" cx="0" cy="0" r="1" gradientTransform="translate(77 47) rotate(50) scale(172)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".24"/>
      <stop offset=".58" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="0" cy="0" r="1" gradientTransform="translate(59 207) rotate(-40) scale(122)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ECB246" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ECB246" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="0" cy="0" r="1" gradientTransform="translate(205 43) rotate(135) scale(112)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66B8A5" stop-opacity=".25"/>
      <stop offset="1" stop-color="#66B8A5" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".38"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="18" y="16" width="220" height="220" rx="54" fill="url(#glass)"/>
    <rect x="18" y="16" width="220" height="220" rx="54" fill="url(#teal)"/>
    <rect x="18" y="16" width="220" height="220" rx="54" fill="url(#ember)"/>
    <rect x="18.75" y="16.75" width="218.5" height="218.5" rx="53.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
    <rect x="26" y="24" width="204" height="204" rx="47" fill="url(#shine)"/>
  </g>
  <!-- Только favicon вкладки: полупрозрачное стекло с тихими фирменными
       оттенками. В шапке, оплате и подвале сайта используется чистый znak.png. -->
  <image href="znak.png" x="52" y="55" width="152" height="146" preserveAspectRatio="xMidYMid meet"/>
</svg>
